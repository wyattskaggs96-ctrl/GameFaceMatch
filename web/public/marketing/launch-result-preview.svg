<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GameFace Match safe result preview</title>
  <desc id="desc">Example result layout with verified catalog unavailable and no fake game settings.</desc>
  <rect width="1200" height="675" fill="#edf6e8"/>
  <rect x="78" y="64" width="1044" height="547" rx="18" fill="#ffffff" stroke="#d7e2d2"/>
  <text x="124" y="138" fill="#1f563b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Example result preview</text>
  <text x="124" y="202" fill="#10251d" font-family="Arial, sans-serif" font-size="48" font-weight="800">Top-three verified matches</text>
  <text x="124" y="248" fill="#56665d" font-family="Arial, sans-serif" font-size="24">Shown only after approved catalog records are loaded.</text>
  <g>
    <rect x="124" y="306" width="290" height="162" rx="12" fill="#fff6db" stroke="#d7e2d2"/>
    <rect x="455" y="306" width="290" height="162" rx="12" fill="#fff6db" stroke="#d7e2d2"/>
    <rect x="786" y="306" width="290" height="162" rx="12" fill="#fff6db" stroke="#d7e2d2"/>
    <text x="156" y="368" fill="#10251d" font-family="Arial, sans-serif" font-size="24" font-weight="800">Best verified match</text>
    <text x="487" y="368" fill="#10251d" font-family="Arial, sans-serif" font-size="24" font-weight="800">Second verified match</text>
    <text x="818" y="368" fill="#10251d" font-family="Arial, sans-serif" font-size="24" font-weight="800">Third verified match</text>
    <text x="156" y="418" fill="#8a6100" font-family="Arial, sans-serif" font-size="20">Unavailable until verified</text>
    <text x="487" y="418" fill="#8a6100" font-family="Arial, sans-serif" font-size="20">Unavailable until verified</text>
    <text x="818" y="418" fill="#8a6100" font-family="Arial, sans-serif" font-size="20">Unavailable until verified</text>
  </g>
  <rect x="124" y="510" width="952" height="58" rx="8" fill="#f5fbff" stroke="#d7e2d2"/>
  <text x="154" y="547" fill="#246ca8" font-family="Arial, sans-serif" font-size="21" font-weight="700">No fake head, hair, facial-hair, slider, or menu values appear in previews.</text>
</svg>
